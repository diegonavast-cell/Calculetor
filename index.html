<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <input type="text" readonly id="pantalla">


<div class="caja">
    <div class="caja1">
       <button onclick="Agregar(7)">7</button> 
    </div>
    <div class="caja2">
         <button onclick="Agregar(8)">8</button>
    </div>
    <div class="caja3">
         <button onclick="Agregar(9)">9</button>
    </div>
    <div class="caja4">
        <button onclick="Agregar('/')">÷</button>
    </div>
</div>

<div class="caja">
    <div class="caja5">
        <button onclick="Agregar(4)">4</button>
    </div>
    <div class="caja6">
        <button onclick="Agregar(5)">5</button>
    </div>
    <div class="caja7">
        <button onclick="Agregar(6)">6</button>
    </div>
    <div class="caja8">
        <button onclick="Agregar('*')">×</button>
    </div>
</div>

<div class="caja">
    <div class="caja9">
       <button onclick="Agregar(1)">1</button> 
    </div>
    <div class="caja10">
        <button onclick="Agregar(2)">2</button>
    </div>
    <div class="caja11">
        <button onclick="Agregar(3)">3</button>
    </div>
    <div class="caja12">
        <button onclick="Agregar('-')">-</button>
    </div>
</div>

<div class="caja">
    <div class="caja13">
        <button onclick="Eliminar()">C</button>
    </div>
    <div class="caja14">
        <button onclick="Agregar(0)">0</button>
    </div>
    <div class="caja15">
        <button onclick="Calcular()">=</button>
    </div>
    <div class="caja16">
        <button onclick="Agregar('+')">+</button>
    </div>
</div>








   


    <script src="codigo.js"></script>
</body>

</html>
